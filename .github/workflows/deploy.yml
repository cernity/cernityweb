name: deploy

on:
  push:
    branches: [main]
  pull_request:

# OIDC token to assume the AWS deploy role; read-only repo checkout.
permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

      # Publish only on a direct push to main — never on PRs (incl. forks, which
      # cannot mint an id-token anyway). Build above still runs on every PR.
      - name: DEBUG OIDC sub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          TOK=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c "import sys,json;print(json.load(sys.stdin)['value'])")
          echo "$TOK" | cut -d. -f2 | python3 -c "import sys,base64,json;p=sys.stdin.read().strip();p+='='*(-len(p)%4);d=json.loads(base64.urlsafe_b64decode(p));print('OIDC_SUB='+str(d.get('sub')));print('OIDC_AUD='+str(d.get('aud')))"
      - name: Deploy to S3 + invalidate CloudFront
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: us-east-2
      - name: Sync
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          aws s3 sync dist/ "s3://${{ vars.AWS_BUCKET }}" --delete
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.AWS_DISTRIBUTION_ID }}" --paths "/*"
